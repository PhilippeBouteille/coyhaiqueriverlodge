<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coyhaique River Lodge — Patagonia</title>
<meta name="description" content="Coyhaique River Lodge · Español · English · Français">
<meta name="robots" content="noindex, nofollow">
<link rel="canonical" href="https://coyhaiqueriverlodge.com/">
<link rel="alternate" hreflang="es" href="https://coyhaiqueriverlodge.com/es/">
<link rel="alternate" hreflang="en" href="https://coyhaiqueriverlodge.com/en/">
<link rel="alternate" hreflang="fr" href="https://coyhaiqueriverlodge.com/fr/">
<link rel="alternate" hreflang="x-default" href="https://coyhaiqueriverlodge.com/">
<link rel="icon" type="image/png" href="assets/img/logo.png">
<style>
  html,body{height:100%;margin:0;background:#241610;}
  body{display:flex;align-items:center;justify-content:center;}
  img{height:96px;width:auto;filter:brightness(0) invert(1);}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;}
  noscript a{color:#F7F3EA;font:600 15px system-ui,sans-serif;margin:0 10px;}
</style>
</head>
<body>
  <img src="assets/img/logo-hero.png" alt="Coyhaique River Lodge">
  <nav class="sr-only" aria-label="Language">
    <a href="es/" hreflang="es" data-lang="es">Español</a>
    <a href="en/" hreflang="en" data-lang="en">English</a>
    <a href="fr/" hreflang="fr" data-lang="fr">Français</a>
  </nav>
  <noscript><div style="position:fixed;bottom:40px;left:0;right:0;text-align:center">    <a href="es/" hreflang="es" data-lang="es">Español</a>
    <a href="en/" hreflang="en" data-lang="en">English</a>
    <a href="fr/" hreflang="fr" data-lang="fr">Français</a></div></noscript>
<script>
  // Idioma: preferencia guardada > idioma del navegador > inglés
  (function () {
    var pick = null;
    try {
      var saved = localStorage.getItem('crl_lang');
      var pool = saved ? [saved] : (navigator.languages || [navigator.language || '']);
      for (var i = 0; i < pool.length && !pick; i++) {
        var l = String(pool[i]).slice(0, 2).toLowerCase();
        if (l === 'es' || l === 'en' || l === 'fr') pick = l;
      }
    } catch (e) {}
    location.replace((pick || 'en') + '/');
  })();
</script>
</body>
</html>
